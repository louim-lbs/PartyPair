name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Vérifier l'environnement
        run: |
          echo "java  : $(java -version 2>&1 | head -1)"
          echo "gradle: $(gradle --version | grep Gradle | head -1)"
          echo "sdk   : $ANDROID_HOME"

      - name: Compilation
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/party-pair.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: party-pair-apk
          path: out/party-pair.apk

      - name: Créer la release sur tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/party-pair.apk
