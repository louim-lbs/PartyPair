name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # La variante github garde le verificateur de mise a jour ; celle destinee
      # a F-Droid s'en passe et n'a pas a etre compilee ici.
      - name: Compilation
        run: |
          set -o pipefail
          gradle assembleGithubDebug --no-daemon 2>&1 | tee build.log

      # Les erreurs Kotlin sont noyees dans un journal de plusieurs centaines de
      # lignes. On les recopie ici : cette page est la premiere que l'on consulte.
      - name: Erreurs de compilation
        if: failure()
        run: |
          {
            echo "## Erreurs de compilation"
            echo ""
            echo '```'
            grep -E "^e: |error:" build.log | head -40 || true
            echo '```'
            echo ""
            echo "<details><summary>40 dernieres lignes du journal</summary>"
            echo ""
            echo '```'
            tail -40 build.log
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Renommer l'APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/github/debug/app-github-debug.apk out/party-pair.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: party-pair-apk
          path: out/party-pair.apk

      - name: Creer la release sur tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/party-pair.apk
